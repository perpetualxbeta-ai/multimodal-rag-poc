# multimodal-rag-poc configuration.
#
# Any value can be overridden with an environment variable (or a line in .env):
# prefix MMRAG_, nested keys joined by "__". Examples:
#   MMRAG_LLM__MODEL=ollama/llama3.2-vision
#   MMRAG_RETRIEVAL__TOP_K=8
# API keys (GEMINI_API_KEY, OPENAI_API_KEY, ...) are read by litellm from the environment / .env.
#
# The defaults below run entirely on the Gemini API (free tier via Google AI Studio):
# no torch download and no local GPU needed.

qdrant:
  path: data/qdrant          # local on-disk store; persists between runs
  url: null                  # set e.g. http://localhost:6333 to use a Qdrant server instead of `path`
  collection: mmrag_chunks

extraction:
  output_dir: data/processed/images
  chunk_size: 1200
  chunk_overlap: 200
  image_dpi: 150
  table_backend: pymupdf     # pymupdf | unstructured (needs poppler + tesseract)

embedding:
  text:
    provider: litellm        # litellm (API) | local (sentence-transformers, needs torch)
    model: gemini/gemini-embedding-001
    dimension: 3072          # required for provider=litellm; must match the model's output size
    # Local alternative:
    # provider: local
    # model: sentence-transformers/all-MiniLM-L6-v2
  image_strategy: caption    # caption (vision LLM summary) | clip (local CLIP) | both
  caption_model: gemini/gemini-3.8-flash
  caption_concurrency: 2     # keep low on the Gemini free tier
  clip_model: sentence-transformers/clip-ViT-B-32

retrieval:
  top_k: 6
  max_images: 3
  max_context_chars: 12000
  reranker: keyword          # none | keyword | cross-encoder (needs sentence-transformers)
  reranker_weight: 0.5
  cross_encoder_model: cross-encoder/ms-marco-MiniLM-L-6-v2

llm:
  model: gemini/gemini-3.8-flash
  fallback_models: []        # e.g. [ollama/llama3.2-vision]
  temperature: 0.1
  max_tokens: 1024
  api_base: null             # e.g. http://localhost:11434 for Ollama

log_level: INFO
